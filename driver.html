<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body class="bg-gray-100 font-sans">

<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Driver Dashboard</h1>
    <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
  </div>

  <div id="driverInfo" class="bg-white p-4 rounded-lg shadow mb-4 hidden">
    <p><strong>Driver:</strong> <span id="driverName"></span></p>
    <p><strong>Email:</strong> <span id="driverEmail"></span></p>
    <p><strong>Phone:</strong> <span id="driverPhone"></span></p>
  </div>

  <div id="trackingInfo" class="bg-white p-4 rounded-lg shadow mb-4 hidden">
    <h2 class="font-bold text-xl mb-2">Tracking Info</h2>
    <p><strong>Tracking ID:</strong> <span id="trackingId"></span></p>
    <p><strong>Customer:</strong> <span id="customerName"></span></p>
    <p><strong>Pickup:</strong> <span id="pickupLoc"></span></p>
    <p><strong>Delivery:</strong> <span id="deliveryLoc"></span></p>
    <p><strong>Status:</strong> <span id="status"></span></p>
  </div>

  <div id="map" class="w-full h-[400px] rounded-lg shadow hidden"></div>
</div>
<script>
const SUPABASE_URL = "https://xncutsnsqmgboacqnvlj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_CaIZ6ht7hq1bBE8hxer8yA_wrKa7Nta";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= DEBUG HELPERS ================= */
function logError(context, error) {
  console.error(`❌ ${context}`, error || "null");
}

function logInfo(context, data) {
  console.log(`ℹ️ ${context}`, data || "null");
}
/* ================================================= */

let map, driverMarker;
const params = new URLSearchParams(window.location.search);
const tid = params.get("tid");
console.log("🚀 initDriver STARTED, tracking_id:", tid);

async function initDriver() {
  try {
    /* 1️⃣ AUTH */
    const { data: { session }, error: authError } = await supabaseClient.auth.getSession();
    logError("Auth getSession", authError);
    logInfo("Auth session", session);

    if (!session) {
      logInfo("No session, redirecting to OAuth", null);
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href }
      });
      return;
    }

    const email = session.user.email;
    logInfo("Authenticated user email", email);

    /* 2️⃣ DRIVER */
    const { data: driver, error: driverError } =
      await supabaseClient.from("drivers")
        .select("*")
        .eq("email", email)
        .single();
    logError("Fetch driver error", driverError);
    logInfo("Fetched driver", driver);

    if (!driver) {
      console.warn("Driver not found for email", email);
      return;
    }

    document.getElementById("driverInfo").classList.remove("hidden");
    document.getElementById("driverName").textContent = driver.name || "N/A";
    document.getElementById("driverEmail").textContent = driver.email || "N/A";
    document.getElementById("driverPhone").textContent = driver.phone || "N/A";

    /* 3️⃣ TRACKING */
    const { data: tracking, error: trackingError } =
      await supabaseClient.from("tracking")
        .select(`*, customer:customer_id(name, phone)`)
        .eq("tracking_id", tid)
        .eq("driver_id", driver.id)
        .single();
    logError("Fetch tracking error", trackingError);
    logInfo("Fetched tracking", tracking);

    if (!tracking) {
      console.warn("Unauthorized or missing tracking for ID:", tid);
      return;
    }

    if (!tracking.driver_approved) {
      const { error: approveError } = await supabaseClient.from("tracking")
        .update({ driver_approved: true, status: "in progress" })
        .eq("tracking_id", tid);
      logError("Auto approve driver error", approveError);
      logInfo("Auto approve driver result", approveError ? "Failed" : "Success");
    }

    document.getElementById("trackingInfo").classList.remove("hidden");
    document.getElementById("trackingId").textContent = tracking.tracking_id || "N/A";
    document.getElementById("customerName").textContent = tracking.customer?.name || "N/A";
    document.getElementById("pickupLoc").textContent = tracking.pickup_location || "Not set";
    document.getElementById("deliveryLoc").textContent = tracking.delivery_location || "Not set";
    document.getElementById("status").textContent = tracking.status || "Unknown";

    /* 4️⃣ MAP */
    document.getElementById("map").classList.remove("hidden");
    map = L.map("map").setView([0, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    if (tracking.pickup_location) await geocode(tracking.pickup_location, "Pickup");
    if (tracking.delivery_location) await geocode(tracking.delivery_location, "Delivery");

    /* 5️⃣ GEOLOCATION */
    navigator.geolocation.watchPosition(async pos => {
      const { latitude, longitude } = pos.coords;
      logInfo("Driver geolocation", { latitude, longitude });

      if (!driverMarker) {
        driverMarker = L.marker([latitude, longitude]).addTo(map);
        map.setView([latitude, longitude], 13);
      } else {
        driverMarker.setLatLng([latitude, longitude]);
      }

      const { error: locationError, data: locationData } = 
        await supabaseClient.from("driver_location").upsert({
          driver_id: Number(driver.id),
          tracking_id: tid,
          lat: latitude,
          lng: longitude,
          is_online: true,
          last_seen: new Date().toISOString()
        }, { onConflict: ['driver_id', 'tracking_id'] });

      logError("Upsert driver_location error", locationError);
      logInfo("Upsert driver_location data", locationData);

    }, geoErr => console.error("❌ Geolocation error", geoErr), { enableHighAccuracy: true });

    /* 6️⃣ REALTIME */
    supabaseClient.channel("public:driver_location")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "driver_location", filter: `tracking_id=eq.${tid}` },
        payload => {
          logInfo("Realtime payload", payload.new);
          if (driverMarker) {
            driverMarker.setLatLng([payload.new.lat, payload.new.lng]);
            map.setView([payload.new.lat, payload.new.lng]);
          }
        }
      ).subscribe();

    logInfo("Realtime subscribed", tid);

  } catch (err) {
    console.error("🔥 UNEXPECTED ERROR", err);
  }
}

/* GEOCODE */
async function geocode(address, label) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
    const data = await res.json();
    if (!data.length) {
      console.warn("Geocode returned empty for", address);
      return;
    }
    const lat = +data[0].lat;
    const lon = +data[0].lon;
    L.marker([lat, lon], { title: label }).addTo(map);
  } catch (e) {
    console.error("❌ Geocode error", e);
  }
}

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click", async () => {
  const { error } = await supabaseClient.auth.signOut();
  logError("Logout error", error);
  window.location.reload();
});

initDriver();
</script>

</body>
</html>
